[project]
name = "apizit-flask-network-api"
version = "1.0.0"
description = "Bounded network diagnostic API for APIZIT."
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
